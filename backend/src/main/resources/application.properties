spring.application.name=demo

# A URI do MongoDB NAO fica no codigo. Defina a variavel de ambiente MONGODB_URI
# com a URI do Atlas (ex.: mongodb+srv://USUARIO:SENHA@cluster0.xxxxx.mongodb.net/demo).
# Sem a variavel, usa um MongoDB local na porta padrao.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/demo}

server.port=8080
